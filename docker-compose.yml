version: '3.8'

services:
  backend:
    build: ./backend
    container_name: finclusion_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/finclusion.db:/app/finclusion.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finclusion_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
